name: PHPUnit Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
    paths:
      - '**.php'
      - '.github/workflows/phpunit-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: PHP ${{ matrix.php }} / MySQL ${{ matrix.db-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.2' ]
        db-version: [ '8.0' ]

    services:
      mysql:
        image: mysql:${{ matrix.db-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: wp_test
          MYSQL_PASSWORD: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    env:
      WPT_PREPARE_DIR: /tmp/wp-test-runner
      WPT_TEST_DIR: /tmp/wp-test-runner
      WPT_DB_NAME: wordpress_test
      WPT_DB_USER: wp_test
      # A quote, a backslash and a placeholder name, so the run proves that
      # prepare.php writes the password into wp-tests-config.php as given.
      WPT_DB_PASSWORD: 'wp''te\st-localhost'
      WPT_DB_HOST: 127.0.0.1
      WPT_REPORT_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}
          persist-credentials: false

      # The mysql image writes MYSQL_PASSWORD into SQL without escaping it, so
      # the password above is set here instead.
      - name: Set the database password
        env:
          MYSQL_PWD: root
        run: |
          mysql -h 127.0.0.1 -u root <<'SQL'
          SET SESSION sql_mode = 'NO_BACKSLASH_ESCAPES';
          ALTER USER 'wp_test'@'%' IDENTIFIED BY 'wp''te\st-localhost';
          SQL

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Prepare environment
        run: php prepare.php

      - name: Check the database password in wp-tests-config.php
        run: |
          php -r 'require getenv( "WPT_PREPARE_DIR" ) . "/wp-tests-config.php"; exit( DB_PASSWORD === getenv( "WPT_DB_PASSWORD" ) ? 0 : 1 );'

      - name: Run unit tests
        run: php test.php
        continue-on-error: true

      - name: Report results
        run: php report.php
        continue-on-error: true

      - name: Cleanup
        run: php cleanup.php

      - name: Verify database cleanup
        env:
          MYSQL_PWD: ${{ env.WPT_DB_PASSWORD }}
        run: |
          TABLES=$(mysql -h 127.0.0.1 -u wp_test wordpress_test -N -e "SHOW TABLES LIKE 'wptests\_%'")
          if [ -n "$TABLES" ]; then
            echo "Test tables remain after cleanup:"
            echo "$TABLES"
            exit 1
          fi
